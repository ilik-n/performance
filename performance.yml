name: API Performance Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      threads:
        description: 'Number of virtual users'
        required: false
        default: '50'
      duration:
        description: 'Test duration in seconds'
        required: false
        default: '60'

jobs:
  performance-test:
    runs-on: ubuntu-latest
    name: jMeter — ${{ github.event.inputs.threads || 50 }} users / ${{ github.event.inputs.duration || 60 }}s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (jMeter requires JDK 11+)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and install Apache jMeter
        run: |
          JMETER_VERSION="5.6.3"
          wget -q "https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf "apache-jmeter-${JMETER_VERSION}.tgz"
          echo "JMETER_HOME=$(pwd)/apache-jmeter-${JMETER_VERSION}" >> $GITHUB_ENV
          echo "Installed jMeter ${JMETER_VERSION}"

      - name: Run performance tests
        run: |
          chmod +x run_tests.sh
          JMETER_HOME=$JMETER_HOME ./run_tests.sh \
            ${{ github.event.inputs.threads || 50 }} \
            30 \
            ${{ github.event.inputs.duration || 60 }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()   # upload even if test failed
        with:
          name: jmeter-report-${{ github.run_number }}
          path: results/report_*/
          retention-days: 30

      - name: Upload raw results (.jtl)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results-${{ github.run_number }}
          path: results/results_*.jtl
          retention-days: 30

      - name: Post summary to job
        if: always()
        run: |
          RESULTS=$(ls results/results_*.jtl 2>/dev/null | head -1)
          if [ -n "$RESULTS" ]; then
            TOTAL=$(tail -n +2 "$RESULTS" | wc -l)
            ERRORS=$(tail -n +2 "$RESULTS" | awk -F',' '$8=="false"' | wc -l)
            echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Total requests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| Virtual users | ${{ github.event.inputs.threads || 50 }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Duration | ${{ github.event.inputs.duration || 60 }}s |" >> $GITHUB_STEP_SUMMARY
          fi
